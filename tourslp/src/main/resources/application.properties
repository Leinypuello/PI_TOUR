spring.application.name=tourslp

# Puerto del servidor
server.port=8080

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tours?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=89053063161
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA

